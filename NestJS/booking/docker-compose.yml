services:
  db:
    image: postgres:16-alpine
    container_name: booking_nest_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking_db}
      POSTGRES_USER: ${POSTGRES_USER:-booking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepass}
    ports:
      - '5434:5432'
    volumes:
      - postgres_nest_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-booking_user} -d ${POSTGRES_DB:-booking_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: booking_nest_web
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-booking_db}
      POSTGRES_USER: ${POSTGRES_USER:-booking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepass}
      JWT_SECRET: ${JWT_SECRET:-access-secret-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refresh-secret-key}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_nest_data:
